# mise 2026.11.10 or later: the http: backend accepts filter_bins only from that version
min_version = "2026.11.10"

[tools]
"cargo:pdf_oxide_cli" = "latest"
"github:obsidianmd/obsidian-releases" = "latest"
herdr = "latest"
"github:sheprd-labs/sheprd" = "latest"
"github:rtk-ai/rtk" = "latest"
jiq = "latest"
"aqua:anomalyco/opencode" = "1"  # 1.x only: 2.x (npm:@opencode/cli) waits for plugin/fleet support
"pipx:frogmouth" = { version = "latest", uvx_args = "--python 3.13" }
uv = "latest"
restic = "0.19.1"

# From omalap (migration 2026-10); goose and git-filter-repo already come from brew and pipx
"aqua:erikjuhani/basalt" = "latest"  # binary sits in a sub-folder mise does not add to PATH
bun = "latest"
"github:Piebald-AI/splitrail" = "latest"
"github:matthart1983/diskwatch" = "latest"
"github:matthart1983/netwatch" = "latest"
"github:matthart1983/syswatch" = "latest"
"github:szhekpisov/diffyml" = "latest"
"github:xguot/difi" = "latest"
"npm:@mixedbread/mgrep" = "latest"
"npm:hunkdiff" = "latest"
"npm:md-to-pdf" = "latest"
"pipx:claudeshell" = "latest"
"pipx:datalab-python-sdk" = "latest"
"aqua:jdx/usage" = "latest"
"npm:critique" = { version = "latest", npm = { package_manager = "bun" } }
"github:reekta92/clin-rs" = "latest"
"github:bjarneo/ku" = "latest"
"pipx:ghgrab" = "latest"
"github:anordal/shellharden" = "latest"
"cargo:usbtree" = "latest"
"github:rgburke/grv" = { version = "latest", rename_exe = "grv" }
"aqua:lusingander/serie" = "latest"
"github:wtnqk/ftdv" = "latest"
"github:chmouel/lazyworktree" = "latest"
"github:ahkohd/oyo" = "latest"
gitui = "latest"
"github:DanielCardonaRojas/codemark" = "latest"
lazyssh = "latest"
lazyjournal = "latest"
superfile = "latest"
codex = "latest"
antigravity-cli = "latest"
"npm:skills" = "latest"
"npm:backpass" = "latest"
"npm:acpx" = "latest"
pi = "latest"

# Used by the chezmoi install scripts: jq filters the pipx spec file, kubectl runs krew
jq = "latest"
kubectl = "latest"

# adb: the same tool key and version as cles-en-main's pin, which wins inside that repository.
# Bump both together: one adb server per user serves every client, and a client of another version restarts it.
# filter_bins keeps the archive's other binaries (sqlite3, mke2fs, fastboot...) off PATH. Google ships no Linux arm64 archive.
[tools."http:adb"]
version = "37.0.3"
bin_path = "platform-tools"
filter_bins = ["adb"]

[tools."http:adb".platforms]
linux-x64 = { url = "https://dl.google.com/android/repository/platform-tools_r{{ version }}-linux.zip", checksum = "sha256:214548146cadb2ca3508143d8a1d4be4c59de5bb837253e3ede89ed74cf450d1" }

[settings]
# aube (the default JS package manager) aborts on packages with install scripts
npm.package_manager = "npm"
# GitHub requests use the keyring login of gh: no token is kept in the shell environment, and anonymous calls are limited to 60 an hour
github.credential_command = "gh auth token"
