"github:matthart1983/netwatch" = "latest"
"github:matthart1983/syswatch" = "latest"
"github:szhekpisov/diffyml" = "latest"
"github:xguot/difi" = "latest"
"npm:@mixedbread/mgrep" = "latest"
"npm:hunkdiff" = "latest"
"npm:md-to-pdf" = "latest"
"pipx:claudeshell" = "latest"
"pipx:datalab-python-sdk" = "latest"
"aqua:jdx/usage" = "latest"
"npm:critique" = { version = "latest", npm = { package_manager = "bun" } }
"github:reekta92/clin-rs" = "latest"
"github:bjarneo/ku" = "latest"
"pipx:ghgrab" = "latest"
"github:anordal/shellharden" = "latest"
"cargo:usbtree" = "latest"
"github:rgburke/grv" = { version = "latest", rename_exe = "grv" }
"aqua:lusingander/serie" = "latest"
